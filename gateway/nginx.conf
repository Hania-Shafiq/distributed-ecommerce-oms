server {
    listen 8000;
    server_name localhost;

    # ── Docker Embedded DNS Resolver (auto-refreshes dynamic container IPs) ──
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Gateway Health Check ──────────────────────────────────────────────────
    location = /health {
        access_log off;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"status":"healthy","service":"gateway"}\n';
    }

    # ── User Service (Port 8001) ──────────────────────────────────────────────
    location /signup {
        set $user_upstream "http://user-service:8001";
        proxy_pass $user_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login {
        set $user_upstream "http://user-service:8001";
        proxy_pass $user_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users {
        set $user_upstream "http://user-service:8001";
        proxy_pass $user_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Product Service (Port 8006) ───────────────────────────────────────────
    location /products {
        set $product_upstream "http://product-service:8006";
        proxy_pass $product_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Order Service (Port 8004) ─────────────────────────────────────────────
    location /orders {
        set $order_upstream "http://order-service:8004";
        proxy_pass $order_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Inventory Service (Port 8003) ─────────────────────────────────────────
    location /inventory {
        set $inventory_upstream "http://inventory-service:8003";
        proxy_pass $inventory_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin Analytics Service (Port 8002) ───────────────────────────────────
    location /analytics {
        set $analytics_upstream "http://admin-analytics:8002";
        proxy_pass $analytics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Recommendation Service (Port 8005) ────────────────────────────────────
    location /recommendations {
        set $recommendation_upstream "http://recommendation-service:8005";
        proxy_pass $recommendation_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /graph {
        set $recommendation_upstream "http://recommendation-service:8005";
        proxy_pass $recommendation_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
