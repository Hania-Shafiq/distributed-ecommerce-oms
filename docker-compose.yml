
# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Distributed E-Commerce OMS
# ─────────────────────────────────────────────────────────────────────────────
# Services defined here:
#   Infrastructure  : users_db, products_db, orders_db, inventory_db,
#                     elasticsearch, neo4j
#   Application     : product-service (port 8001), admin-analytics (port 8002)
#
# Networking note:
#   Compose automatically creates a shared bridge network for all services.
#   Services can reach each other by SERVICE NAME as the hostname.
#   e.g. product-service → "products_db:5432" (internal port, not host port)
#        product-service → "elasticsearch:9200"
#   The host-side ports (5434, 9200, etc.) are only for external tools
#   (DBeaver, Kibana, curl from your laptop).
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure: PostgreSQL databases ─────────────────────────────────────

  users_db:
    image: postgres:16
    container_name: users_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"   # host:container — 5433 on your machine → 5432 inside
    volumes:
      - users_data:/var/lib/postgresql/data

  products_db:
    image: postgres:16
    container_name: products_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: products_db
    ports:
      - "5434:5432"   # Connect from your machine via localhost:5434
    volumes:
      - products_data:/var/lib/postgresql/data

  orders_db:
    image: postgres:16
    container_name: orders_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5435:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data

  inventory_db:
    image: postgres:16
    container_name: inventory_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5436:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data

  # ── Infrastructure: Elasticsearch ────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ── Infrastructure: Neo4j ─────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # ── Application: product-service ─────────────────────────────────────────────
  # Builds from ./product-service/Dockerfile and serves the Products CRUD API.

  product-service:
    build:
      context: ./product-service   # Docker looks for Dockerfile here
      dockerfile: Dockerfile
    container_name: product-service
    restart: always
    ports:
      - "8001:8001"   # Access from your browser / Postman at localhost:8001
    depends_on:
      - products_db    # Compose starts products_db before this service.
      - elasticsearch  # Elasticsearch must be up before product-service tries
                       # to create its index on startup.
    environment:
      # ── Why we set these here instead of relying on .env ──────────────────
      # Inside Docker, "localhost" refers to the container itself, not the
      # host machine or any sibling container.  We must use the Docker Compose
      # SERVICE NAME as the hostname so Docker's internal DNS resolves it.
      #
      # These environment: values OVERRIDE whatever is in product-service/.env
      # at runtime — so the .env file keeps working for local dev (localhost)
      # while Docker gets the correct container-name URLs.
      #
      # DATABASE_URL: port is 5432 (internal) NOT 5434 (host-mapped).
      #   5434:5432 means host-port-5434 → container-port-5432.
      #   Inside Docker we always use the container's own port.
      - DATABASE_URL=postgresql://postgres:postgres@products_db:5432/products_db
      - ELASTICSEARCH_URL=http://elasticsearch:9200

  # ── Application: admin-analytics ─────────────────────────────────────────────
  # Builds from ./admin-analytics/Dockerfile and serves the analytics/reporting API.
  # Uses DuckDB + postgres_scanner to run OLAP queries directly on products_db.

  admin-analytics:
    build:
      context: ./admin-analytics
      dockerfile: Dockerfile
    container_name: admin-analytics
    restart: always
    ports:
      - "8002:8002"   # Access at localhost:8002
    depends_on:
      - products_db   # DuckDB will ATTACH to products_db at startup — it must
                      # be running first, otherwise the ATTACH fails and the
                      # service crashes on the first analytics request.
    environment:
      # Same localhost → service-name substitution as above.
      # DuckDB's ATTACH uses this DSN to connect to PostgreSQL over the network.
      # Port is 5432 (internal container port), not 5434 (host-mapped port).
      - PRODUCTS_DB_URL=postgresql://postgres:postgres@products_db:5432/products_db
      - LOW_STOCK_THRESHOLD=10


# ── Named volumes ─────────────────────────────────────────────────────────────
# Named volumes persist data across container restarts and docker-compose down.
# Without them, all database data would be lost every time a container stops.
volumes:
  users_data:
  products_data:
  orders_data:
  inventory_data:
  es_data:
  neo4j_data: