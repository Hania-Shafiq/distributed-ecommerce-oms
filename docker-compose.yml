# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Distributed E-Commerce OMS (Full Monorepo)
# ─────────────────────────────────────────────────────────────────────────────
# Start all 13 services with a single command:
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ═══════════════════════════════════════════════════════════════════════════
  #  1. INFRASTRUCTURE & DATABASES
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Users PostgreSQL Database (Port 5433 host -> 5432 container) ───────────
  users_db:
    image: postgres:16
    container_name: users_db
    restart: always
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${USERS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - users_data:/var/lib/postgresql/data

  # ── Products PostgreSQL Database (Port 5434 host -> 5432 container) ────────
  products_db:
    image: postgres:16
    container_name: products_db
    restart: always
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${PRODUCTS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PRODUCTS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${PRODUCTS_DB_NAME:-products_db}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - products_data:/var/lib/postgresql/data

  # ── Orders PostgreSQL Database (Port 5435 host -> 5432 container) ──────────
  orders_db:
    image: postgres:16
    container_name: orders_db
    restart: always
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${ORDERS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${ORDERS_DB_NAME:-orders_db}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data

  # ── Inventory PostgreSQL Database (Port 5436 host -> 5432 container) ───────
  inventory_db:
    image: postgres:16
    container_name: inventory_db
    restart: always
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${INVENTORY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data

  # ── Elasticsearch (Port 9200) ──────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # ── Neo4j Graph Database (Ports 7474 HTTP, 7687 Bolt) ──────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: always
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

  # ═══════════════════════════════════════════════════════════════════════════
  #  2. APPLICATION MICROSERVICES (FastAPI)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── User Service (Port 8001) ───────────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --timeout-keep-alive 65 --limit-concurrency 500
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - users_db
    environment:
      - DATABASE_URL=postgresql://${USERS_DB_USER:-postgres}:${USERS_DB_PASSWORD:-postgres}@users_db:5432/${USERS_DB_NAME:-users_db}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}

  # ── Admin Analytics Service (Port 8002) ────────────────────────────────────
  admin-analytics:
    build:
      context: ./admin-analytics
      dockerfile: Dockerfile
    container_name: admin-analytics
    restart: always
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - products_db
      - orders_db
      - elasticsearch
      - product-service
      - inventory-service
    environment:
      - PRODUCTS_DB_URL=postgresql://${PRODUCTS_DB_USER:-postgres}:${PRODUCTS_DB_PASSWORD:-postgres}@products_db:5432/${PRODUCTS_DB_NAME:-products_db}
      - ORDERS_DB_URL=postgresql://${ORDERS_DB_USER:-postgres}:${ORDERS_DB_PASSWORD:-postgres}@orders_db:5432/${ORDERS_DB_NAME:-orders_db}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PRODUCT_SERVICE_URL=http://product-service:8006
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - LOW_STOCK_THRESHOLD=10
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}


  # ── Inventory Service (Port 8003) ──────────────────────────────────────────
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    restart: always
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      - inventory_db
      - product-service
    environment:
      - DATABASE_URL=postgresql://${INVENTORY_DB_USER:-postgres}:${INVENTORY_DB_PASSWORD:-postgres}@inventory_db:5432/${INVENTORY_DB_NAME:-inventory_db}
      - PRODUCT_SERVICE_URL=http://product-service:8006
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}

  # ── Order Service / SAGA Orchestrator (Port 8004) ──────────────────────────
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8004 --timeout-keep-alive 65 --limit-concurrency 500
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      - orders_db
      - inventory-service
      - product-service
      - recommendation-service
    environment:
      - DATABASE_URL=postgresql://${ORDERS_DB_USER:-postgres}:${ORDERS_DB_PASSWORD:-postgres}@orders_db:5432/${ORDERS_DB_NAME:-orders_db}
      - USE_MOCK=false
      - PRODUCT_SERVICE_URL=http://product-service:8006
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:8005
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}

  # ── Recommendation Service (Port 8005) ─────────────────────────────────────
  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    container_name: recommendation-service
    restart: always
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}

  # ── Product Service (Port 8006) ────────────────────────────────────
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8006 --timeout-keep-alive 65 --limit-concurrency 500
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      products_db:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${PRODUCTS_DB_USER:-postgres}:${PRODUCTS_DB_PASSWORD:-postgres}@products_db:5432/${PRODUCTS_DB_NAME:-products_db}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}

  # ═══════════════════════════════════════════════════════════════════════════
  #  3. REACT FRONTEND
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - user-service
      - admin-analytics
      - inventory-service
      - order-service
      - recommendation-service
      - product-service
      - gateway

  # ═══════════════════════════════════════════════════════════════════════════
  #  4. API GATEWAY (NGINX)
  # ═══════════════════════════════════════════════════════════════════════════

  gateway:
    image: nginx:alpine
    container_name: gateway
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
      - inventory-service
      - admin-analytics
      - recommendation-service


# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  users_data:
  products_data:
  orders_data:
  inventory_data:
  es_data:
  neo4j_data: